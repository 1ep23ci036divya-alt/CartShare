<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room — CartShare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="room.css">
</head>
<body>

<div class="container py-4">

  <!-- Header -->
  <header class="room-header card-soft p-3 p-md-4 mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div class="d-flex align-items-center gap-3">
        <span class="brand-basket">🛒</span>
        <div>
          <div class="footer-note mb-0">Room code</div>
          <div class="d-flex align-items-center gap-2">
            <span id="roomCodeDisplay" class="mono fw-800 room-code">------</span>
            <button id="copyCodeBtn" class="btn btn-sm btn-outline-pink py-1">Copy</button>
          </div>
        </div>
      </div>

      <div class="text-end">
        <div class="footer-note mb-1">You're in as</div>
        <span id="currentUserDisplay" class="chip"></span>
      </div>
    </div>

    <div class="mt-3">
      <div class="footer-note mb-2"><span id="memberCount">0</span> member(s) in this room</div>
      <div id="membersList" class="d-flex flex-wrap gap-2"></div>
    </div>
  </header>

  <div class="row g-4">

    <!-- LEFT: Cart -->
    <main class="col-lg-8">

      <div class="card-soft p-3 p-md-4 mb-4">
        <h2 class="h5 fw-800 mb-3">Add an item</h2>
        <form id="addItemForm" class="row g-2 align-items-end">
          <div class="col-6 col-md-5">
            <label class="form-label" for="itemName">Item</label>
            <input type="text" id="itemName" class="form-control" placeholder="e.g. Milk" maxlength="30" required>
          </div>
          <div class="col-3 col-md-2">
            <label class="form-label" for="itemQty">Qty</label>
            <input type="number" id="itemQty" class="form-control" value="1" min="1" required>
          </div>
          <div class="col-3 col-md-3">
            <label class="form-label" for="itemPrice">Price / unit (₹)</label>
            <input type="number" id="itemPrice" class="form-control" min="0" step="0.5" placeholder="50" required>
          </div>
          <div class="col-12 col-md-2">
            <button type="submit" class="btn btn-lime w-100">+ Add item</button>
          </div>
        </form>
      </div>

      <div class="card-soft p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 fw-800 mb-0">Shared cart</h2>
          <span class="footer-note">Everyone in this room can edit</span>
        </div>

        <div class="table-responsive">
          <table class="table cart-table align-middle mb-0">
            <thead>
              <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Amount</th>
                <th>Added by</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cartBody">
              <!-- rows injected by cart.js -->
            </tbody>
          </table>
        </div>

        <div id="emptyCartMsg" class="empty-state text-center py-4 d-none">
          Cart's empty — add the first item above 🛍️
        </div>

        <div class="d-flex justify-content-between align-items-center total-row pt-3 mt-2">
          <span class="h5 fw-800 mb-0">Total</span>
          <span id="cartTotal" class="h4 fw-800 mb-0">₹0</span>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-2 justify-content-end mt-4">
        <button id="leaveBtn" class="btn btn-ghost">Leave room</button>
        <button id="receiptBtn" class="btn btn-pink-solid">Generate receipt</button>
      </div>
    </main>

    <!-- RIGHT: Activity -->
    <aside class="col-lg-4">
      <div class="card-soft p-3 p-md-4 activity-card">
        <h2 class="h5 fw-800 mb-3">Activity</h2>
        <ul id="activityList" class="activity-list list-unstyled mb-0"></ul>
      </div>
      <p class="footer-note mt-3">
        This tab updates automatically when a roommate changes the cart in another tab.
      </p>
    </aside>

  </div>
</div>

<script src="storage.js"></script>
<script src="cart.js"></script>
<script src="activity.js"></script>
<script src="room.js"></script>
</body>
</html>
